<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aceitação de Condições — Localiza Fugas</title>
<style>
  :root{ --azul:#1e3a5f; --azul2:#1d4ed8; --amber:#b45309; --amberbg:#fef3c7; --red:#b91c1c; --redbg:#fee2e2; --verde:#166534; --verdebg:#dcfce7; --txt:#1f2937; --mut:#64748b; --bord:#e2e8f0; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:#f1f5f9; color:var(--txt); -webkit-text-size-adjust:100%; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px; }
  .card{ background:#fff; border:1px solid var(--bord); border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.06); }
  .hd{ background:var(--azul); color:#fff; padding:18px 20px; }
  .hd .marca{ font-size:18px; font-weight:800; letter-spacing:.3px; }
  .hd .sub{ font-size:12px; opacity:.8; margin-top:2px; }
  .bd{ padding:18px 20px; }
  .lin{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:14px; border-bottom:1px solid #f1f5f9; }
  .lin .k{ color:var(--mut); }
  .lin .v{ font-weight:600; text-align:right; }
  .avisos{ margin:18px 0 6px; }
  .aviso{ border-radius:12px; padding:13px 15px; margin-bottom:10px; display:flex; gap:10px; align-items:flex-start; }
  .aviso .ic{ font-size:20px; line-height:1; flex-shrink:0; }
  .aviso .t{ font-weight:800; font-size:14px; margin-bottom:2px; }
  .aviso .d{ font-size:13px; line-height:1.5; }
  .aviso.amber{ background:var(--amberbg); } .aviso.amber .t,.aviso.amber .d{ color:var(--amber); }
  .aviso.red{ background:var(--redbg); } .aviso.red .t,.aviso.red .d{ color:var(--red); }
  .clausulas{ margin-top:16px; background:#f8fafc; border:1px solid var(--bord); border-radius:10px; }
  .clausulas summary{ cursor:pointer; padding:13px 15px; font-weight:700; font-size:13px; color:var(--azul); list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .clausulas summary::-webkit-details-marker{ display:none; }
  .clausulas[open] summary{ border-bottom:1px solid var(--bord); }
  .clausulas .conteudo{ padding:14px 16px; font-size:12.5px; line-height:1.6; color:#374151; white-space:pre-wrap; max-height:320px; overflow:auto; }
  .campo{ margin-top:18px; }
  .campo label{ display:block; font-size:12px; color:var(--mut); margin-bottom:5px; font-weight:600; }
  .campo input{ width:100%; padding:12px 14px; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; }
  .chk{ display:flex; gap:10px; align-items:flex-start; margin-top:14px; font-size:13px; color:#374151; }
  .chk input{ width:20px; height:20px; margin-top:1px; flex-shrink:0; }
  .btn{ width:100%; margin-top:16px; border:none; border-radius:10px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn-ok{ background:var(--verde); color:#fff; }
  .btn-ok:disabled{ background:#94a3b8; cursor:not-allowed; }
  .estado{ text-align:center; padding:28px 20px; }
  .estado .circ{ width:56px; height:56px; border-radius:50%; background:var(--verdebg); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 12px; }
  .estado h2{ margin:0 0 4px; font-size:18px; }
  .estado p{ margin:0; color:var(--mut); font-size:13px; }
  .prova{ margin-top:16px; background:#f8fafc; border:1px solid var(--bord); border-radius:10px; padding:13px 15px; text-align:left; font-size:12.5px; line-height:1.9; color:#475569; }
  .prova .tt{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:#94a3b8; margin-bottom:6px; }
  .rodape{ text-align:center; font-size:11px; color:#94a3b8; margin-top:14px; }
  .msg{ text-align:center; padding:40px 20px; color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="hd">
      <div class="marca">💧 Localiza Fugas</div>
      <div class="sub">Aceitação das condições do serviço</div>
    </div>
    <div class="bd" id="conteudo">
      <div class="msg">A carregar o seu agendamento…</div>
    </div>
  </div>
  <div class="rodape">Localiza Fugas · Valentim Fialho Unip. Lda.</div>
</div>

<script>
setTimeout(function(){ var c=document.getElementById('conteudo'); if(c && /A carregar/.test(c.textContent)){ c.innerHTML='<div class="msg">\u26a0\ufe0f A p\u00e1gina demorou a responder.<br>Verifique a liga\u00e7\u00e3o \u00e0 internet e recarregue. Se persistir, contacte a Localiza Fugas.</div>'; } }, 12000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyBZIZpjrD62jPMTDPQKS5uBJ4Wj0W1tZmA",
  authDomain:        "portal-localiza-f08c5.firebaseapp.com",
  projectId:         "portal-localiza-f08c5",
  storageBucket:     "portal-localiza-f08c5.firebasestorage.app",
  messagingSenderId: "159682339032",
  appId:             "1:159682339032:web:3a4b9011337611b208b7ad"
};
const app = initializeApp(FIREBASE_CONFIG);
const db  = getFirestore(app);

const cont = document.getElementById('conteudo');
window.addEventListener('error', e=>{ if(cont) cont.innerHTML = '<div class="msg">\u26a0\ufe0f Erro t\u00e9cnico ao abrir a p\u00e1gina.<br><small style="color:#94a3b8">'+ ((e&&e.message)||'') +'</small></div>'; });
window.addEventListener('unhandledrejection', e=>{ if(cont) cont.innerHTML = '<div class="msg">\u26a0\ufe0f N\u00e3o foi poss\u00edvel ligar ao servidor.<br><small style="color:#94a3b8">'+ (((e&&e.reason&&e.reason.message))||(e&&e.reason)||'') +'</small></div>'; });
const params = new URLSearchParams(location.search);
const osId = params.get('os');
const token = params.get('t');

// Mesmo esquema de token da página de tracking (SHA-256 de osId + segredo)
async function tokenValido(id, tok){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(id + 'hg_track_2026'));
    const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    return hex.slice(0,16) === tok;
  }catch(e){ return false; }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtData(d){ if(!d) return '—'; const p=String(d).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }

// Texto das cláusulas — as mesmas que vão no email de agendamento
const CLAUSULAS = `INFORMAÇÕES IMPORTANTES

🕐 Horário de chegada
O horário indicado é uma estimativa. Devido à natureza do nosso trabalho — que pode envolver situações imprevistas nos serviços anteriores — admitimos uma margem de tolerância de até 60 minutos relativamente à hora marcada. Caso prevejamos um atraso superior, entraremos em contacto.

🚗 Taxa de deslocação
Caso o técnico se desloque ao local e, por razões alheias à nossa vontade (acesso impedido, cliente ausente, impossibilidade de realizar o serviço por condições do imóvel, etc.), não seja possível efectuar o trabalho, é devida uma taxa de deslocação de 50€ + IVA.

⚠️ Condições de realização do serviço
Para a realização do serviço de peritagem poderá ser necessário abrir e fechar passadores, retirar sanitas, autoclismos e outros acessórios, bem como subir a telhados e coberturas. A Localiza Fugas não assume responsabilidade por danos que possam ocorrer durante o manuseamento destes equipamentos e estruturas, nomeadamente quebras de peças ou estruturas em estado de desgaste pré-existente.

🔑 Acesso e presença
Durante toda a intervenção deve estar presente no local uma pessoa maior de idade responsável pelo imóvel. O acesso a todas as áreas relevantes deve estar assegurado, incluindo, quando aplicável, a frações ou espaços vizinhos.

🔧 Reparação
O serviço de pesquisa/deteção NÃO inclui a reparação da fuga nem a reposição de acabamentos (azulejo, reboco, pintura, etc.). Eventuais reparações são orçamentadas e adjudicadas à parte.

💳 Pagamento e entrega do relatório
O serviço é pago no final da pesquisa. O relatório é entregue até 5 dias úteis após a conclusão do trabalho e a confirmação do recebimento do pagamento.

✍️ Autorização de intervenção
Ao confirmar o agendamento, o cliente autoriza a realização dos trabalhos de peritagem descritos, incluindo o manuseamento de equipamentos e estruturas acima indicado.

🔒 Proteção de dados (RGPD)
Os dados pessoais do cliente são tratados apenas para efeitos da prestação e faturação deste serviço, nos termos da legislação aplicável.`;

const CLAUSULAS_VERSAO = '2026-08-agendamento-v3';

// ── Regra de cancelamento (editável) ──────────────────────────
const HORAS_UTEIS_MIN   = 24;   // mínimo de horas úteis (sem fim de semana) antes do agendamento
const TAXA_CANCEL_TARDIO = 50;  // € — taxa de cancelamento fora do prazo
// Monta a data/hora do agendamento a partir de os.data (AAAA-MM-DD) + os.horaIni (HH:MM)
function montarDataHora(data, hora){ if(!data) return null; const h=(hora||'09:00').slice(0,5); const dt=new Date(data+'T'+h+':00'); return isNaN(dt.getTime())?null:dt; }
// Conta horas de calendário entre a e b, SEM contar sábados e domingos
function horasUteisEntre(a, b){ if(!a||!b||b<=a) return 0; if(b-a > 60*86400000) return 9999; let h=0; for(let t=a.getTime(); t<b.getTime(); t+=3600000){ const d=new Date(t).getDay(); if(d!==0 && d!==6) h++; } return h; }

function erro(txt){ cont.innerHTML = `<div class="msg">⚠️ ${esc(txt)}</div>`; }

function mostrarAceite(nome, quando){
  cont.innerHTML = `
    <div class="estado">
      <div class="circ">✓</div>
      <h2>Condições aceites</h2>
      <p>${esc(quando)} · ${esc(nome)}</p>
      <div class="prova">
        <div class="tt">Registado para prova</div>
        <div>👤 Nome: ${esc(nome)}</div>
        <div>🕐 Data/hora: ${esc(quando)}</div>
        <div>📄 Versão das condições aceites</div>
      </div>
    </div>`;
}

async function iniciar(){
  if(!osId || !token){ erro('Link inválido ou incompleto.'); return; }
  if(!(await tokenValido(osId, token))){ erro('Link inválido. Contacte a Localiza Fugas.'); return; }

  let os;
  try{
    const snap = await getDoc(doc(db, 'ordens', osId));
    if(!snap.exists()){ erro('Agendamento não encontrado.'); return; }
    os = snap.data();
  }catch(e){ erro('Não foi possível carregar o agendamento. Tente novamente.'); return; }

  // Já aceite anteriormente?
  if(os.aceitacaoCondicoes && os.aceitacaoCondicoes.nome){
    const q = os.aceitacaoCondicoes.quando || '';
    mostrarAceite(os.aceitacaoCondicoes.nome, q ? new Date(q).toLocaleString('pt-PT') : '');
    return;
  }

  // Dados do cliente e serviço (para mostrar no resumo)
  let cliNome = os.contactNome || '', srvNome = '', morada = '';
  try{
    if(os.clienteId){ const c = await getDoc(doc(db,'clientes',os.clienteId)); if(c.exists()){ const cd=c.data(); cliNome = cliNome||cd.nome||''; morada = [cd.srvRua||cd.rua, cd.srvCp||cd.cp, cd.srvLocalidade||cd.localidade].filter(Boolean).join(', '); } }
    if(os.servicoId){ const s = await getDoc(doc(db,'servicos',os.servicoId)); if(s.exists()) srvNome = s.data().nome||''; }
  }catch(e){}

  const horaIni = (os.horaIni||'').slice(0,5), horaFim = (os.horaFim||'').slice(0,5);

  // Prova leve de que o cliente viu a confirmação (não bloqueia)
  if(!os.confirmacaoVistaEm && !os.canceladoPeloCliente){
    updateDoc(doc(db,'ordens',osId), { confirmacaoVistaEm: new Date().toISOString() }).catch(()=>{});
  }

  // Já cancelado pelo cliente?
  if(os.canceladoPeloCliente){
    cont.innerHTML = `<div class="estado"><div class="circ" style="background:#dc2626">✕</div><h2>Agendamento cancelado</h2><p>Já registámos o seu pedido de cancelamento. Se foi engano, contacte-nos.</p></div>`;
    return;
  }

  const temCodigo = !!(os.aceitacaoCodigo);

  cont.innerHTML = `
    <div class="estado" style="padding-bottom:6px">
      <div class="circ">✓</div>
      <h2>Agendamento confirmado</h2>
      <p>Está tudo tratado — não precisa de fazer nada. A nossa equipa vai ao local na data indicada.</p>
    </div>

    <div class="lin"><span class="k">Cliente</span><span class="v">${esc(cliNome||'—')}</span></div>
    <div class="lin"><span class="k">Data</span><span class="v">${esc(fmtData(os.data))}</span></div>
    ${horaIni?`<div class="lin"><span class="k">Hora prevista</span><span class="v">${esc(horaIni)}${horaFim?' – '+esc(horaFim):''}</span></div>`:''}
    <div class="lin"><span class="k">Serviço</span><span class="v">${esc(srvNome||'—')}</span></div>
    ${morada?`<div class="lin"><span class="k">Local</span><span class="v">${esc(morada)}</span></div>`:''}

    <div class="avisos">
      <div class="aviso amber"><div class="ic">👥</div><div><div class="t">Outras frações</div><div class="d">Se a intervenção envolver outras frações, os vizinhos têm de ser avisados previamente.</div></div></div>
      <div class="aviso red"><div class="ic">🚗</div><div><div class="t">Deslocação</div><div class="d">Se nos deslocarmos ao local e não for possível realizar o trabalho, será cobrada a taxa de deslocação prevista.</div></div></div>
    </div>

    <details class="clausulas">
      <summary><span>📄 Ver todas as condições do serviço</span><span>▾</span></summary>
      <div class="conteudo">${esc(CLAUSULAS)}</div>
    </details>

    <div style="margin-top:22px;padding-top:16px;border-top:1px solid #e2e8f0;text-align:center;">
      <div style="font-size:13px;color:#64748b;margin-bottom:10px;">Não pode comparecer ou precisa de alterar?</div>
      <div class="campo" id="cancel-motivo-wrap" style="display:none;text-align:left;">
        <label>Motivo (opcional)</label>
        <input id="ac-motivo" type="text" placeholder="Ex.: mudança de planos, já resolvido…">
      </div>
      ${temCodigo?`<div class="campo" id="cancel-cod-wrap" style="display:none;text-align:left;">
        <label>Código de confirmação (recebido no email)</label>
        <input id="ac-codigo" type="text" inputmode="numeric" maxlength="4" placeholder="4 dígitos" style="letter-spacing:8px;text-align:center;font-size:20px;font-weight:700;">
      </div>`:''}
      <button id="ac-cancel-toggle" class="btn" style="background:#fff;border:1px solid #fecaca;color:#b91c1c;">Preciso de cancelar</button>
      <button id="ac-cancel" class="btn" style="display:none;background:#dc2626;color:#fff;">Confirmar cancelamento</button>
      <div id="ac-erro" style="color:#dc2626;font-size:12px;text-align:center;margin-top:8px;min-height:16px;"></div>
    </div>`;

  const toggleEl = document.getElementById('ac-cancel-toggle');
  const cancelEl = document.getElementById('ac-cancel');
  const motivoWrap = document.getElementById('cancel-motivo-wrap');
  const codWrap = document.getElementById('cancel-cod-wrap');
  const erroEl = document.getElementById('ac-erro');

  toggleEl.addEventListener('click', ()=>{
    motivoWrap.style.display='block';
    if(codWrap) codWrap.style.display='block';
    toggleEl.style.display='none';
    cancelEl.style.display='inline-block';
  });

  cancelEl.addEventListener('click', async ()=>{
    if(temCodigo){
      const cod=(document.getElementById('ac-codigo')?.value||'').trim();
      if(cod !== String(os.aceitacaoCodigo)){ erroEl.textContent='Código errado. Verifique o email.'; return; }
    }
    const motivo = (document.getElementById('ac-motivo')?.value||'').trim();

    // ── Faltam menos de 24 horas úteis? → fora do prazo (taxa + confirmação por contacto) ──
    const quandoAg = montarDataHora(os.data, os.horaIni);
    const hUteis   = horasUteisEntre(new Date(), quandoAg);
    if(quandoAg && hUteis < HORAS_UTEIS_MIN){
      if(!confirm(`Faltam menos de ${HORAS_UTEIS_MIN} horas úteis para o agendamento.\n\nO cancelamento fora deste prazo tem uma taxa de ${TAXA_CANCEL_TARDIO}€ e só é confirmado após contacto com a empresa.\n\nQuer registar o pedido de cancelamento?`)) return;
      cancelEl.disabled=true; cancelEl.textContent='A registar…'; erroEl.textContent='';
      const pedido = { quando:new Date().toISOString(), motivo, foraPrazo:true, taxa:TAXA_CANCEL_TARDIO, userAgent:navigator.userAgent.slice(0,200), via:'pagina_publica' };
      try{
        await updateDoc(doc(db,'ordens',osId), { cancelamentoPedido:pedido });
        cont.innerHTML = `<div class="estado"><div class="circ" style="background:#d97706">⏳</div><h2>Pedido registado</h2><p>Como falta menos de ${HORAS_UTEIS_MIN} horas úteis, o cancelamento tem uma taxa de <strong>${TAXA_CANCEL_TARDIO}€</strong> e <strong>só é confirmado após contacto com a empresa</strong>. Vamos entrar em contacto consigo.</p></div>`;
      }catch(e){
        cancelEl.disabled=false; cancelEl.textContent='Confirmar cancelamento';
        erroEl.textContent='Não foi possível registar. Tente novamente ou contacte-nos.';
      }
      return;
    }

    // ── Dentro do prazo → cancela normalmente ──
    if(!confirm('Tem a certeza de que quer cancelar este agendamento?')) return;
    cancelEl.disabled=true; cancelEl.textContent='A cancelar…'; erroEl.textContent='';
    const registo = { quando:new Date().toISOString(), motivo, userAgent:navigator.userAgent.slice(0,200), via:'pagina_publica' };
    try{
      await updateDoc(doc(db,'ordens',osId), { canceladoPeloCliente:true, cancelamentoCliente:registo });
      cont.innerHTML = `<div class="estado"><div class="circ" style="background:#dc2626">✕</div><h2>Agendamento cancelado</h2><p>Registámos o seu cancelamento. Obrigado por avisar.</p></div>`;
    }catch(e){
      cancelEl.disabled=false; cancelEl.textContent='Confirmar cancelamento';
      erroEl.textContent='Não foi possível registar. Tente novamente ou contacte-nos.';
    }
  });
}
iniciar().catch(e=>{ if(cont) cont.innerHTML = '<div class="msg">\u26a0\ufe0f '+ ((e&&e.message)||e) +'</div>'; });
</script>
</body>
</html>
