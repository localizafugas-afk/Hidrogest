<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HidroGest · Técnico a caminho</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f0f4f8;
  color: #0f172a;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
.header {
  background: linear-gradient(135deg, #0369a1, #0284c7);
  padding: 16px 20px 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(2,132,199,.3);
}
.header-top {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.logo { font-size: 28px; }
.brand { font-size: 18px; font-weight: 900; color: #fff; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,.7); }

/* STATUS CARD */
.status-card {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.status-pulse {
  width: 14px; height: 14px; border-radius: 50%;
  background: #4ade80;
  flex-shrink: 0;
  box-shadow: 0 0 0 0 rgba(74,222,128,.6);
  animation: pulse-ring 1.5s infinite;
}
.status-pulse.offline { background: #f87171; animation: none; }
.status-pulse.chegou { background: #fbbf24; animation: none; }
@keyframes pulse-ring {
  0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
  70% { box-shadow: 0 0 0 10px rgba(74,222,128,0); }
  100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
}
.status-text { flex: 1; }
.status-title { font-size: 14px; font-weight: 800; color: #fff; }
.status-sub { font-size: 11px; color: rgba(255,255,255,.75); margin-top: 1px; }
.eta-chip {
  background: rgba(255,255,255,.2);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}

/* MAPA */
#map {
  flex: 1;
  min-height: 0;
  z-index: 1;
}

/* INFO BOTTOM */
.info-bar {
  background: #fff;
  border-top: 1px solid #e2e8f0;
  padding: 14px 20px;
  flex-shrink: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom));
}
.info-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.info-row:last-child { margin-bottom: 0; }
.info-ico { font-size: 18px; flex-shrink: 0; }
.info-content { flex: 1; }
.info-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.info-val { font-size: 14px; font-weight: 700; color: #0f172a; }

/* LOADING / ERROR */
#screen-loading, #screen-error {
  position: fixed; inset: 0; z-index: 999;
  background: linear-gradient(135deg, #dbeafe, #eff6ff);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 32px;
  text-align: center;
}
#screen-error { display: none; }
.big-ico { font-size: 64px; }
.big-title { font-size: 22px; font-weight: 900; color: #0369a1; }
.big-sub { font-size: 14px; color: #64748b; line-height: 1.5; max-width: 300px; }
.dots { display: flex; gap: 6px; }
.dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: #0284c7; opacity: .3;
  animation: dot 1.2s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%,80%,100%{opacity:.3;transform:scale(1)} 40%{opacity:1;transform:scale(1.3)} }

/* Marcador customizado */
.tec-marker {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #0284c7, #0369a1);
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 3px solid #fff;
  box-shadow: 0 4px 16px rgba(2,132,199,.5);
  display: flex; align-items: center; justify-content: center;
}
.tec-marker-inner {
  transform: rotate(45deg);
  font-size: 20px;
}
.dest-marker {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #16a34a, #15803d);
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 4px 12px rgba(22,163,74,.4);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
</style>
</head>
<body>

<!-- LOADING -->
<div id="screen-loading">
  <div class="big-ico">🚗</div>
  <div class="big-title">A localizar técnico...</div>
  <div class="big-sub">Aguarda um momento enquanto buscamos a localização em tempo real.</div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<!-- ERRO -->
<div id="screen-error">
  <div class="big-ico">🔗</div>
  <div class="big-title" id="err-title">Link inválido</div>
  <div class="big-sub" id="err-msg">Este link de rastreamento não é válido ou já expirou.</div>
  <a href="https://hidrogest.net" style="margin-top:8px;padding:12px 24px;background:#0284c7;color:#fff;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;">Ir para HidroGest</a>
</div>

<!-- APP -->
<div class="header" id="main-header" style="display:none;">
  <div class="header-top">
    <span class="logo">💧</span>
    <div>
      <div class="brand">HidroGest</div>
      <div class="brand-sub">Rastreamento em tempo real</div>
    </div>
  </div>
  <div class="status-card">
    <div class="status-pulse" id="status-pulse"></div>
    <div class="status-text">
      <div class="status-title" id="status-title">A calcular...</div>
      <div class="status-sub" id="status-sub">Actualizado agora</div>
    </div>
    <div class="eta-chip" id="eta-chip" style="display:none;">—</div>
  </div>
</div>

<div id="map" style="display:none;"></div>

<div class="info-bar" id="info-bar" style="display:none;">
  <div class="info-row">
    <span class="info-ico">👷</span>
    <div class="info-content">
      <div class="info-label">Técnico</div>
      <div class="info-val" id="info-tec">—</div>
    </div>
  </div>
  <div class="info-row" id="info-morada-row" style="display:none;">
    <span class="info-ico">📍</span>
    <div class="info-content">
      <div class="info-label">Destino</div>
      <div class="info-val" id="info-morada">—</div>
    </div>
  </div>
  <div class="info-row">
    <span class="info-ico">🕐</span>
    <div class="info-content">
      <div class="info-label">Última actualização</div>
      <div class="info-val" id="info-update">—</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBZIZpjrD62jPMTDPQKS5uBJ4Wj0W1tZmA",
  authDomain: "portal-localiza-f08c5.firebaseapp.com",
  projectId: "portal-localiza-f08c5",
  storageBucket: "portal-localiza-f08c5.firebasestorage.app",
  messagingSenderId: "159682339032",
  appId: "1:159682339032:web:3a4b9011337611b208b7ad"
};

// ── Ler parâmetros da URL ──────────────────────────────────
const params = new URLSearchParams(location.search);
const osId   = params.get('os') || '';
const token  = params.get('t')  || '';

// ── Estado ────────────────────────────────────────────────
let _map = null;
let _tecMarker = null;
let _destMarker = null;
let _routeLine = null;
let _db = null;
let _unsubscribe = null;
let _tecId = null;
let _osData = null;

// ── Verificar token ───────────────────────────────────────
async function verificarToken(osId, token) {
  const msgUint8 = new TextEncoder().encode(osId + 'hg_track_2026');
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
  const hashHex = Array.from(new Uint8Array(hashBuffer))
    .map(b => b.toString(16).padStart(2, '0')).join('');
  return hashHex.slice(0, 16) === token;
}

// ── Iniciar ───────────────────────────────────────────────
async function init() {
  if (!osId || !token) {
    mostrarErro('Link inválido', 'Este link não contém os parâmetros necessários.');
    return;
  }

  // Verificar token
  const tokenValido = await verificarToken(osId, token);
  if (!tokenValido) {
    mostrarErro('Link inválido', 'O link de rastreamento não é válido ou foi alterado.');
    return;
  }

  // Carregar Firebase
  try {
    await carregarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await carregarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.firestore();
  } catch(e) {
    mostrarErro('Sem ligação', 'Não foi possível ligar ao servidor. Verifica a internet e tenta novamente.');
    return;
  }

  // Carregar dados da OS
  try {
    const osSnap = await _db.collection('ordens').doc(osId).get();
    if (!osSnap.exists) {
      mostrarErro('Ordem não encontrada', 'A ordem de serviço não foi encontrada no sistema.');
      return;
    }
    _osData = osSnap.data();

    // OS já concluída?
    if (_osData.estado === 'concluida' || _osData.estado === 'cancelada') {
      mostrarErro(
        _osData.estado === 'cancelada' ? '❌ Serviço cancelado' : '✅ Serviço concluído',
        _osData.estado === 'cancelada'
          ? 'Este serviço foi cancelado.'
          : 'O técnico já concluiu o serviço. Obrigado pela preferência!'
      );
      return;
    }

    // Obter técnico
    const tecs = _osData.tecnicos || [];
    if (!tecs.length) {
      mostrarErro('Sem técnico', 'Ainda não foi atribuído um técnico a esta ordem.');
      return;
    }
    _tecId = tecs[0];

    // Carregar info do técnico
    const userSnap = await _db.collection('users').doc(_tecId).get();
    const tecNome = userSnap.exists ? (userSnap.data().name || 'Técnico') : 'Técnico';
    document.getElementById('info-tec').textContent = tecNome;

    // Carregar morada do cliente
    if (_osData.clienteId) {
      const cliSnap = await _db.collection('clientes').doc(_osData.clienteId).get();
      if (cliSnap.exists) {
        const cli = cliSnap.data();
        const morada = [cli.srvRua||cli.rua, cli.srvLocalidade||cli.localidade].filter(Boolean).join(', ');
        if (morada) {
          document.getElementById('info-morada').textContent = morada;
          document.getElementById('info-morada-row').style.display = '';
        }
      }
    }
  } catch(e) {
    mostrarErro('Erro', 'Não foi possível carregar os dados. Tenta novamente.');
    return;
  }

  // Mostrar UI
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('main-header').style.display = '';
  document.getElementById('map').style.display = '';
  document.getElementById('info-bar').style.display = '';

  // Iniciar mapa
  iniciarMapa();

  // Ouvir localização em tempo real
  ouvirLocalizacao();
}

// ── Mapa ──────────────────────────────────────────────────
function iniciarMapa() {
  _map = L.map('map', {
    zoomControl: true,
    attributionControl: false,
  }).setView([41.15, -8.61], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
  }).addTo(_map);
}

function criarIconeTecnico() {
  return L.divIcon({
    className: '',
    html: '<div style="width:44px;height:44px;background:linear-gradient(135deg,#0284c7,#0369a1);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 16px rgba(2,132,199,.5);display:flex;align-items:center;justify-content:center;"><div style="transform:rotate(45deg);font-size:20px;">🔧</div></div>',
    iconSize: [44, 44],
    iconAnchor: [22, 44],
  });
}

function criarIconeDestino() {
  return L.divIcon({
    className: '',
    html: '<div style="width:36px;height:36px;background:linear-gradient(135deg,#16a34a,#15803d);border-radius:50%;border:3px solid #fff;box-shadow:0 4px 12px rgba(22,163,74,.4);display:flex;align-items:center;justify-content:center;font-size:18px;">🏠</div>',
    iconSize: [36, 36],
    iconAnchor: [18, 18],
  });
}

// ── Listener Firebase ─────────────────────────────────────
function ouvirLocalizacao() {
  if (!_tecId) return;

  _unsubscribe = _db.collection('localizacoes').doc(_tecId)
    .onSnapshot(snap => {
      if (!snap.exists) {
        atualizarStatus('aguarda', 'Aguardando localização...', 'O técnico ainda não partiu');
        return;
      }

      const loc = snap.data();
      const lat = loc.lat;
      const lng = loc.lng;
      const ts  = loc.ts ? new Date(loc.ts) : null;

      // Verificar se dados são recentes (menos de 10 min)
      const agoraMs = Date.now();
      const tsMs = ts ? ts.getTime() : 0;
      const minutosAtras = Math.floor((agoraMs - tsMs) / 60000);
      const recente = minutosAtras < 10;

      // Atualizar hora
      if (ts) {
        document.getElementById('info-update').textContent =
          minutosAtras === 0 ? 'Agora mesmo'
          : minutosAtras === 1 ? 'Há 1 minuto'
          : `Há ${minutosAtras} minutos`;
      }

      if (!lat || !lng) {
        atualizarStatus('aguarda', 'A aguardar GPS do técnico...', 'Localização ainda não disponível');
        return;
      }

      // Atualizar marcador
      if (!_tecMarker) {
        _tecMarker = L.marker([lat, lng], { icon: criarIconeTecnico() }).addTo(_map);
        _map.setView([lat, lng], 15);
      } else {
        _tecMarker.setLatLng([lat, lng]);
      }

      // Calcular distância se temos destino
      const moradaTxt = document.getElementById('info-morada').textContent;
      if (moradaTxt && moradaTxt !== '—' && !_destMarker) {
        geocodificar(moradaTxt).then(coords => {
          if (!coords) return;
          _destMarker = L.marker([coords.lat, coords.lng], { icon: criarIconeDestino() }).addTo(_map);
          // Linha entre técnico e destino
          _routeLine = L.polyline([[lat, lng], [coords.lat, coords.lng]], {
            color: '#0284c7', weight: 3, opacity: .6, dashArray: '8,6'
          }).addTo(_map);
          // Ajustar zoom para ver os dois pontos
          const bounds = L.latLngBounds([[lat, lng], [coords.lat, coords.lng]]);
          _map.fitBounds(bounds, { padding: [60, 60] });
          // Calcular distância aproximada
          const dist = distKm(lat, lng, coords.lat, coords.lng);
          const etaMin = Math.round(dist / 40 * 60); // ~40km/h em cidade
          if (etaMin > 0) {
            const etaTxt = etaMin < 2 ? '< 2 min' : etaMin < 60 ? `~${etaMin} min` : `~${Math.round(etaMin/60)}h`;
            document.getElementById('eta-chip').textContent = etaTxt;
            document.getElementById('eta-chip').style.display = '';
          }
        }).catch(() => {});
      } else if (_destMarker && _routeLine) {
        // Atualizar linha
        _routeLine.setLatLngs([[lat, lng], _destMarker.getLatLng()]);
      }

      // Status
      if (loc.online === false || !recente) {
        atualizarStatus('offline', 'Técnico offline', 'Localização desactualizada', 'offline');
      } else if (loc.emDeslocamento) {
        atualizarStatus('ok', '🚗 Técnico a caminho!', 'Em deslocamento para si');
      } else {
        atualizarStatus('ok', '📍 Técnico localizado', 'Activo e disponível');
      }

    }, err => {
      console.warn('Listener error:', err);
      atualizarStatus('offline', 'Sem dados', 'Não foi possível obter localização');
    });
}

// ── Helpers ───────────────────────────────────────────────
function atualizarStatus(tipo, titulo, sub, pulseClass) {
  document.getElementById('status-title').textContent = titulo;
  document.getElementById('status-sub').textContent = sub;
  const pulse = document.getElementById('status-pulse');
  pulse.className = 'status-pulse' + (pulseClass ? ' ' + pulseClass : '');
}

function mostrarErro(titulo, msg) {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-error').style.display = 'flex';
  document.getElementById('err-title').textContent = titulo;
  document.getElementById('err-msg').textContent = msg;
}

function carregarScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function geocodificar(morada) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(morada + ', Portugal');
    const r = await fetch(url, { headers: { 'Accept-Language': 'pt' } });
    const data = await r.json();
    if (data[0]) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
  } catch(e) {}
  return null;
}

// Atualizar hora a cada minuto
setInterval(() => {
  if (_tecMarker) {
    const upd = document.getElementById('info-update').textContent;
    // Re-calcular tempo se necessário - o listener fará isso automaticamente
  }
}, 60000);

// Iniciar
init();
</script>
</body>
</html>
